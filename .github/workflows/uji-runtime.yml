name: Uji Runtime Aplikasi

# Uji di browser sungguhan (Chromium headless): memastikan aplikasi benar-benar
# jalan di pengguna — bukan hanya datanya yang valid.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pasang Playwright + Chromium
        run: |
          pip install playwright segno opencv-python-headless
          playwright install --with-deps chromium

      - name: Uji runtime (9 kategori, gambar, tryout, simulasi, hafalan)
        run: python3 tools/uji-runtime.py

      - name: UJI SEMUA FITUR (52 pemeriksaan - tiap halaman, tombol, ekspor, sinkron)
        run: python3 tools/uji-fitur-lengkap.py
