name: Verifikasi Bank Soal

on:
  push:
    branches: [master, main]
    paths:
      - 'data/**.js'
      - 'index.html'
      - 'sw.js'
      - 'tools/**.py'
      - '.github/workflows/verifikasi.yml'
  pull_request:
  workflow_dispatch:

jobs:
  verifikasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cek akurasi bank soal (kunci, opsi, duplikat, pembahasan, gambar)
        run: python3 tools/verifikasi-soal.py

      - name: Cek sintaks JavaScript
        run: |
          for f in static/js/*.js data/*.js sw.js; do
            node --check "$f" || exit 1
          done
          echo "sintaks JS OK"
